name: Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate skill discovery
        run: npx --yes skills@1.5.18 add . --list

      - name: Validate OpenAI skill metadata
        run: |
          ruby -ryaml -e '
            skills = Dir["skills/*"].select { |path| File.directory?(path) }
            abort("no skill directories found") if skills.empty?
            skills.each do |skill|
              path = File.join(skill, "agents", "openai.yaml")
              abort("missing #{path}") unless File.file?(path)
              YAML.safe_load(File.read(path), permitted_classes: [], permitted_symbols: [], aliases: false)
            end
          '

      - name: Reject installed-file markers
        run: |
          if grep -R -n "hot-skill-hash" skills; then
            echo "Installed-file hash markers must not be committed."
            exit 1
          fi
